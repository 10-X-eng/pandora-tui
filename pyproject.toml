[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pandora-tui"
version = "0.2.0"
description = "A terminal Pandora player with background playback and MPRIS"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["textual>=8,<9", "dbus-next>=0.2.3,<0.3", "pycryptodome>=3.23,<4", "secretstorage>=3.3,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
pandora-tui = "pandora_tui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pandora_tui = ["*.json", "*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
