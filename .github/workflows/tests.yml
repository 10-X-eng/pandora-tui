name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]' build
      - run: python -m pytest -q
      - run: python scripts/audit_release.py
      - run: python packaging/prepare.py
      - run: python scripts/audit_release.py --archive packaging/pandora-tui-0.2.0.tar.gz
      - run: python -m build --wheel
